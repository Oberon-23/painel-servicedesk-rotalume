<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotalume Service Desk</title>
<meta name="description" content="Painel de Service Desk de uma empresa fictícia com assistente de IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
/* Layout: menu lateral escuro com as guias; área principal com manchete em linguagem simples, 4 indicadores com meta e status, gráficos grandes com 12 meses de contexto e detalhes recolhidos. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #121821;
  --ink-2: #485260;
  --muted: #778190;
  --line: #e1e5ea;
  --line-2: #eef1f4;
  --side-bg: #111a24;
  --side-ink: #e8edf2;
  --side-muted: #8d9aa8;
  --side-hover: #1b2733;
  --accent: var(--a-light);
  --accent-ink: #ffffff;
  --accent-soft: var(--a-soft-light);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6;
  --ok: #0b7d3e; --ok-bg: #e2f4e9; --ok-mark: #1a9e55;
  --warn: #8a5a00; --warn-bg: #fcf0d4; --warn-mark: #e0a00e;
  --bad: #b3261e; --bad-bg: #fbe5e3; --bad-mark: #d93a30;
  --seq-1: #e3edfb; --seq-2: #bcd4f5; --seq-3: #8db6ee; --seq-4: #5a93e2; --seq-5: #2f6fc9; --seq-6: #1b4f99;
  --font: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #141b23; --surface-2: #19222b; --ink: #e7ecf1; --ink-2: #a9b3bf; --muted: #7c8794; --line: #253039; --line-2: #1d272f;
    --side-bg: #0a0f14; --side-ink: #e7ecf1; --side-muted: #7f8b97; --side-hover: #151e27;
    --accent: var(--a-dark); --accent-ink: #0b1016; --accent-soft: var(--a-soft-dark);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
    --ok: #57c98a; --ok-bg: #14301f; --ok-mark: #3fbf77; --warn: #f0b440; --warn-bg: #352a10; --warn-mark: #e8ad2e; --bad: #f18b84; --bad-bg: #3b1a18; --bad-mark: #e8645b;
    --seq-1: #16263a; --seq-2: #183a63; --seq-3: #1c528f; --seq-4: #2a6dbf; --seq-5: #4f8fe0; --seq-6: #8dbaf0;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b23; --surface-2: #19222b; --ink: #e7ecf1; --ink-2: #a9b3bf; --muted: #7c8794; --line: #253039; --line-2: #1d272f;
  --side-bg: #0a0f14; --side-ink: #e7ecf1; --side-muted: #7f8b97; --side-hover: #151e27;
  --accent: var(--a-dark); --accent-ink: #0b1016; --accent-soft: var(--a-soft-dark);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --ok: #57c98a; --ok-bg: #14301f; --ok-mark: #3fbf77; --warn: #f0b440; --warn-bg: #352a10; --warn-mark: #e8ad2e; --bad: #f18b84; --bad-bg: #3b1a18; --bad-mark: #e8645b;
  --seq-1: #16263a; --seq-2: #183a63; --seq-3: #1c528f; --seq-4: #2a6dbf; --seq-5: #4f8fe0; --seq-6: #8dbaf0;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-ink); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: calc(22px + env(safe-area-inset-top, 0px)) 16px 18px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; gap: 11px; align-items: center; padding: 0 6px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.logo svg { width: 20px; height: 20px; }
.brand b { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; }
.brand small { display: block; font-size: 11.5px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--side-muted); padding: 0 10px 6px; font-weight: 600; }
.nav button { appearance: none; border: 0; background: none; color: var(--side-ink); text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: center; opacity: .78; }
.nav button svg { width: 19px; height: 19px; grid-row: span 2; }
.nav button span { font-weight: 600; font-size: 14px; }
.nav button small { font-size: 11.5px; color: var(--side-muted); line-height: 1.3; }
.nav button:hover { background: var(--side-hover); opacity: 1; }
.nav button[aria-current="page"] { background: var(--side-hover); opacity: 1; box-shadow: inset 3px 0 0 var(--accent); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--side-muted); padding: 0 6px; }
.side-foot .chip { border-color: #2a3744; color: var(--side-ink); }
.side-foot a { color: var(--side-ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; padding: calc(14px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) 14px 28px; }
.top h1 { font-size: 21px; font-weight: 700; }
.top .sub { color: var(--ink-2); font-size: 13.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 4px 0 10px; box-shadow: var(--shadow); }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.field select { border: 0; background-color: var(--surface); color: var(--ink); color-scheme: inherit; padding: 7px 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; max-width: 220px; }
.field select:focus-visible { outline: none; }
select option, select optgroup { background-color: var(--surface); color: var(--ink); }
select option:checked { background-color: var(--accent-soft); color: var(--ink); }
.field:focus-within { border-color: var(--accent); }
.content { padding: 22px max(28px, env(safe-area-inset-right, 0px)) 40px 28px; display: flex; flex-direction: column; gap: 18px; max-width: 1360px; width: 100%; }
.view[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 18px; }

/* ---------- Manchete ---------- */
.headline { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start; box-shadow: var(--shadow); }
.headline .hi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.headline .hi svg { width: 22px; height: 22px; }
.headline.ok .hi { background: var(--ok-bg); color: var(--ok); }
.headline.warn .hi { background: var(--warn-bg); color: var(--warn); }
.headline.bad .hi { background: var(--bad-bg); color: var(--bad); }
.headline h2 { font-size: 18.5px; font-weight: 650; line-height: 1.35; }
.headline p { color: var(--ink-2); margin-top: 5px; max-width: 95ch; }

/* ---------- Indicadores ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
.kpi .k-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .k-lab { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.kpi .k-val { font-size: 32px; font-weight: 750; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .k-val small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.kpi .k-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.kpi svg.spark { width: 100%; height: 34px; display: block; margin-top: 2px; }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.status.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.delta { font-family: var(--mono); font-size: 11.5px; }
.delta.good { color: var(--ok); } .delta.badd { color: var(--bad); } .delta.flat { color: var(--muted); }

/* Explicação (i) */
.info { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1.4px solid var(--muted); color: var(--muted); font-size: 10.5px; font-weight: 700; font-family: var(--mono); cursor: help; background: none; padding: 0; flex-shrink: 0; }
.info .tip { position: absolute; right: -10px; top: calc(100% + 8px); width: min(250px, 80vw); display: none; background: var(--ink); color: var(--surface); font-family: var(--font); font-weight: 400; font-size: 12.5px; line-height: 1.45; text-align: left; padding: 9px 11px; border-radius: 9px; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .12s; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.info:hover .tip, .info:focus .tip { opacity: 1; display: block; }

/* ---------- Cartões e grade ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
@media (max-width: 1100px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.card h3 { font-size: 15.5px; font-weight: 650; }
.card .how { font-size: 12.5px; color: var(--muted); margin-top: 3px; max-width: 75ch; }
.chart { position: relative; height: 300px; width: 100%; }
.chart.sm { height: 240px; } .chart.lg { height: 340px; }
@media (max-width: 640px) { .chart, .chart.lg { height: 260px; } }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; border-radius: 2px; width: 16px; }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed var(--ink-2); border-radius: 0; }
.legend i.band { width: 16px; height: 10px; border-radius: 2px; }

/* Lista de achados */
.finds { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.finds li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.finds .fi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.finds .fi svg { width: 16px; height: 16px; }
.finds .fi.ok { background: var(--ok-bg); color: var(--ok); }
.finds .fi.warn { background: var(--warn-bg); color: var(--warn); }
.finds .fi.bad { background: var(--bad-bg); color: var(--bad); }
.finds .fi.info { background: var(--accent-soft); color: var(--accent); }
.finds b { font-weight: 650; }
.finds p { color: var(--ink-2); font-size: 13.5px; }
.finds p:first-child { color: var(--ink); font-size: 14px; }

/* Tabelas */
.tscroll { overflow: auto; max-height: 460px; border: 1px solid var(--line); border-radius: 10px; }
.tscroll.free { max-height: none; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.sortable th { cursor: pointer; user-select: none; }
.sortable th[aria-sort="ascending"]::after { content: " ↑"; }
.sortable th[aria-sort="descending"]::after { content: " ↓"; }
.bar-in { display: inline-block; height: 7px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-right: 8px; opacity: .85; }
.meter { width: 84px; height: 7px; border-radius: 4px; background: var(--line-2); display: inline-block; vertical-align: middle; overflow: hidden; margin-right: 8px; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.sub-txt { font-size: 12px; color: var(--muted); }

details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.more > summary { cursor: pointer; list-style: none; padding: 14px 18px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-family: var(--mono); font-size: 18px; color: var(--muted); }
details.more[open] > summary::after { content: "−"; }
details.more > summary small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
details.more > .more-in { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; }

/* Controles */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 8px; align-items: center; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: min(300px, 100%); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chip { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; width: fit-content; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-mark); }
.chip.on .dot { background: var(--ok-mark); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 550; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* Mapa de calor */
.heat { display: grid; gap: 4px; font-size: 11.5px; }
.heat .hl { color: var(--muted); display: flex; align-items: center; }
.heat .hh { color: var(--muted); text-align: center; font-family: var(--mono); font-size: 10.5px; }
.heat .hc { border-radius: 6px; min-height: 30px; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.scale .ramp { display: flex; gap: 2px; } .scale .ramp i { width: 18px; height: 8px; border-radius: 2px; }

/* Sobre */
.prose { display: grid; gap: 10px; color: var(--ink-2); max-width: 78ch; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.prose b { color: var(--ink); }
.formula { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; color: var(--ink); }

.foot { color: var(--muted); font-size: 12px; padding: 0 28px 28px; }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: relative; height: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; overflow: visible; }
  .nav-label, .nav button small, .side-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 4px; margin: 0 -4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { grid-template-columns: 18px auto; white-space: nowrap; padding: 8px 12px; }
  .nav button svg { width: 17px; height: 17px; grid-row: auto; }
  .nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .top { position: relative; backdrop-filter: none; }
  .top-in { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .content { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .foot { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .headline { grid-template-columns: minmax(0, 1fr); }
  .headline .hi { display: none; }
  .field select { max-width: 160px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

:root { --ai: #4a4fc4; --ai-soft: #ebebfb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ai: #a3a6ff; --ai-soft: #24264d; } }
:root[data-theme="dark"] { --ai: #a3a6ff; --ai-soft: #24264d; }
.aibox { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--ai-soft); font-size: 13.5px; display: grid; gap: 6px; }
.aibox ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }

.cmts { display: grid; gap: 8px; max-height: 480px; overflow: auto; }
.cmt { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; }

.stars { font-family: var(--mono); letter-spacing: 1px; }

.chatwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .chatwrap { grid-template-columns: minmax(0, 1fr); } }
.side-cards { display: grid; gap: 14px; }
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); min-height: 560px; }
.chat-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.who-ai { display: flex; gap: 10px; align-items: center; }
.who-ai b { display: block; font-size: 15px; }
.who-ai small { color: var(--muted); font-size: 12px; }
.ai-dot { width: 34px; height: 34px; border-radius: 10px; background: var(--ai); color: #fff; display: grid; place-items: center; }
.ai-dot svg { width: 18px; height: 18px; }
.log { flex: 1; overflow: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; max-height: 600px; }
.msg { max-width: 88%; display: grid; gap: 6px; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; }
.msg.a { align-self: flex-start; }
.msg.a .body { background: var(--surface-2); border: 1px solid var(--line); padding: 12px 15px; border-radius: 16px 16px 16px 4px; display: grid; gap: 7px; }
.msg.a .body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.msg.a .body h4 { font-size: 14.5px; }
.msg .lbl { font-size: 11.5px; color: var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: 5px; }
.step { font-family: var(--mono); font-size: 11px; color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 2px 9px; }
.thinking { color: var(--muted); font-style: italic; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
.composer form { display: flex; gap: 8px; }
.composer textarea { flex: 1; min-width: 0; resize: none; height: 46px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }

.sug:hover { border-color: var(--ai); color: var(--ai); }

.note.ok { background: var(--ok-bg); }

<body>
<template id="tpl-resumo">
  <div id="r-head"></div>
  <div id="r-kpis"></div>
  <div class="grid">
    <div class="card s8">
      <div><h3>Cumprimos o prazo mês a mês?</h3><p class="how">SLA de resposta é o primeiro contato no prazo. SLA de resolução é o problema resolvido no prazo. A faixa sombreada é o período do filtro.</p></div>
      <div id="r-sla-leg"></div>
      <div class="chart lg"><canvas id="r-sla"></canvas></div>
    </div>
    <div class="card s4">
      <div class="card-h"><h3>O que os dados mostram</h3><button class="btn primary" id="btn-brief" hidden></button></div>
      <ul id="r-finds"></ul>
      <div id="r-brief" class="aibox" hidden></div>
    </div>
    <div class="card s6">
      <div><h3>Quantos chamados recebemos?</h3><p class="how">Incidentes (algo parou de funcionar) e requisições (pedidos de acesso, instalação etc.).</p></div>
      <div id="r-vol-leg"></div>
      <div class="chart"><canvas id="r-vol"></canvas></div>
    </div>
    <div class="card s6">
      <div><h3>Por onde os chamados chegam?</h3><p class="how">Participação de cada canal no mês. O portal de autoatendimento foi lançado em junho de 2026.</p></div>
      <div id="r-canal-leg"></div>
      <div class="chart"><canvas id="r-canal"></canvas></div>
    </div>
  </div>
</template>

<template id="tpl-fila">
  <div id="f-head"></div>
  <div id="f-kpis"></div>
  <div class="grid">
    <div class="card s6">
      <div><h3>Há quanto tempo os chamados estão abertos?</h3><p class="how">Fila atual por idade e grupo responsável.</p></div>
      <div id="f-age-leg"></div>
      <div class="chart sm"><canvas id="f-age"></canvas></div>
    </div>
    <div class="card s6">
      <div><h3>Quando os chamados chegam?</h3><p class="how">Média de chamados por hora nos dias úteis do período. Use para planejar a escala.</p></div>
      <div id="f-heat" class="heat"></div>
      <div id="f-scale" class="scale"></div>
    </div>
    <div class="card s12">
      <div class="card-h"><div><h3>Chamados abertos que precisam de atenção</h3><p class="how">Ordenados pelo quanto do prazo já foi consumido.</p></div><span class="sub-txt" id="f-risk-n"></span></div>
      <div class="tscroll"><table id="f-risk"></table></div>
    </div>
  </div>
  <details class="more"><summary>Onde o prazo estoura <small>categoria × prioridade</small></summary><div class="more-in">
    <p class="how">Parte dos chamados resolvidos fora do prazo, no período.</p>
    <div class="tscroll free"><table id="f-matrix"></table></div>
  </div></details>
</template>

<template id="tpl-equipe">
  <div id="e-head"></div>
  <div id="e-kpis"></div>
  <div class="grid">
    <div class="card s5">
      <div><h3>Rapidez × satisfação por analista</h3><p class="how">Mais à esquerda, resolve mais rápido; mais acima, usuários mais satisfeitos. O tamanho do ponto é o volume. Compare pessoas do mesmo grupo.</p></div>
      <div id="e-leg"></div>
      <div class="chart lg"><canvas id="e-bub"></canvas></div>
    </div>
    <div class="card s7">
      <div><h3>Indicadores por analista</h3><p class="how">Use para planejar apoio e treinamento. Clique nos títulos para ordenar.</p></div>
      <div class="tscroll"><table id="e-table"></table></div>
    </div>
  </div>
</template>

<template id="tpl-satisfacao">
  <div id="s-head"></div>
  <div id="s-kpis"></div>
  <div class="grid">
    <div class="card s7">
      <div><h3>A satisfação está melhorando?</h3><p class="how">Nota média da pesquisa após o atendimento, de 1 a 5.</p></div>
      <div class="chart"><canvas id="s-csat"></canvas></div>
    </div>
    <div class="card s5">
      <div><h3>Quais assuntos deixam o usuário menos satisfeito?</h3><p class="how">Nota média por categoria. Em vermelho, abaixo da meta de 4,3.</p></div>
      <div class="chart"><canvas id="s-cat"></canvas></div>
    </div>
    <div class="card s12">
      <div class="card-h"><div><h3>Do que as pessoas reclamam e elogiam</h3><p class="how" id="s-th-how">Comentários agrupados em temas por palavras-chave.</p></div><button class="btn primary" id="btn-themes"></button></div>
      <div id="s-themes" class="themes"></div>
    </div>
  </div>
  <details class="more"><summary>Ler os comentários <small id="s-cn"></small></summary><div class="more-in">
    <div class="row"><div class="seg" id="s-score" role="group" aria-label="Nota"><button data-v="all">Todas</button><button data-v="neg">Notas 1–2</button><button data-v="mid">Nota 3</button><button data-v="pos">Notas 4–5</button></div><input class="search" id="s-search" type="search" placeholder="Buscar nos comentários" aria-label="Buscar nos comentários"></div>
    <div class="cmts" id="s-cmts"></div>
  </div></details>
</template>

<template id="tpl-assistente">
  <div class="chatwrap">
    <div class="chat">
      <div class="chat-h">
        <div class="who-ai"><span class="ai-dot"></span><div><b>Analista virtual</b><small id="ai-state">Verificando…</small></div></div>
        <div class="row" style="gap:8px"><div class="seg" id="ai-mode" role="group" aria-label="Modo"><button data-v="quick">Rápido</button><button data-v="default">Profundo</button></div><button class="btn" id="btn-clear">Nova conversa</button></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="composer">
        <div class="sugs" id="sugs"></div>
        <form id="ask-form"><textarea id="ask" placeholder="Pergunte sobre SLA, fila, equipe, satisfação…" aria-label="Pergunta para a IA"></textarea><button class="btn primary" id="btn-send" type="submit">Perguntar</button><button class="btn" id="btn-stop" type="button" hidden>Parar</button></form>
      </div>
    </div>
    <div class="side-cards">
      <div class="card"><h3>Como funciona</h3><div id="ai-note" class="note">Verificando se a IA está disponível…</div>
        <div class="prose"><p>A IA não recebe a base inteira. Ela consulta os dados com 5 ferramentas e mostra cada consulta que fez:</p>
        <ul><li>indicadores de qualquer recorte</li><li>quebra por categoria, analista, canal, mês ou hora</li><li>fila aberta com risco de prazo</li><li>comentários da pesquisa</li><li>tendência mensal</li></ul></div></div>
      <div class="card"><h3>Perguntas que funcionam bem</h3><div class="prose"><ul><li>Compare o 1º e o 2º semestre</li><li>O portal reduziu os chamados de senha?</li><li>Quais 3 ações dariam mais ganho de SLA?</li><li>Por que o CSAT caiu em março?</li></ul></div></div>
    </div>
  </div>
</template>

<template id="tpl-sobre">
  <div class="grid">
    <div class="card s6"><h3>A empresa e os dados</h3><div class="prose">
      <p>O <b>Grupo Rotalume</b> é fictício, com cerca de 1.200 colaboradores. Este painel mostra o <b>Service Desk interno de TI</b>, a equipe que atende os funcionários com acessos, computadores, rede e sistemas.</p>
      <p>Os dados são gerados no navegador com semente fixa: <b id="ab-n">—</b> chamados de nov/2025 a out/2026, com prioridade, canal, grupo, analista, prazos, pesquisa de satisfação e comentários.</p>
      <p>Eventos colocados de propósito para a análise encontrar:</p>
      <ul>
        <li><b>Migração de e-mail (mar/2026):</b> chamados de e-mail mais que dobram e a satisfação cai.</li>
        <li><b>Portal de autoatendimento (jun/2026):</b> o portal ganha espaço e os chamados de senha diminuem.</li>
        <li><b>Queda da VPN (14/07/2026):</b> 64 chamados de prioridade alta em uma manhã.</li>
        <li><b>Sistemas corporativos:</b> pior cumprimento de prazo e chamados parados há semanas.</li>
      </ul></div></div>
    <div class="card s6"><h3>Definições</h3>
<div class="formula">Prazo de resposta  P1 15 min · P2 30 min · P3 1 h · P4 4 h
Prazo de resolução P1 4 h · P2 8 h · P3 24 h · P4 72 h
(horas corridas, por simplificação)

SLA de resposta  = 1º contato no prazo ÷ chamados
SLA de resolução = resolvidos no prazo ÷ resolvidos
FCR              = resolvidos pelo N1 sem escalonar ÷ chamados
Reabertura       = reabertos pelo usuário ÷ resolvidos
CSAT             = média das notas de 1 a 5</div>
      <div class="prose"><p>As definições seguem as práticas de Gestão de Incidentes e Central de Serviço do ITIL 4.</p></div></div>
    <div class="card s12"><h3>Sobre a IA</h3><div class="prose"><ul>
      <li>Dentro do Claude, as perguntas são respondidas pelo Claude usando a conta de quem está vendo o painel, que autoriza o uso na primeira pergunta.</li>
      <li>Fora do Claude (por exemplo, no GitHub Pages), o assistente funciona em <b>modo demonstração</b>: responde a perguntas comuns com regras calculadas no próprio navegador. Nenhuma chave de API fica no código.</li>
    </ul></div></div>
  </div>
</template>

<script>
/* Kit Rotalume: utilidades, estrutura da página, cartões e gráficos comuns aos três painéis. */
const K = (() => {
  "use strict";
  /* ---------- números aleatórios reprodutíveis ---------- */
  function rng(seed) {
    let a = seed;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const n = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return {
      r, n,
      between: (x, y) => x + (y - x) * r(),
      pickW: (w) => { const s = w.reduce((p, q) => p + q, 0); let x = r() * s; for (let i = 0; i < w.length; i++) { x -= w[i]; if (x <= 0) return i; } return w.length - 1; },
      pick: (arr) => arr[Math.floor(r() * arr.length)],
      poisson: (l) => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; },
      binom: (nn, p) => Math.max(0, Math.round(nn * p + Math.sqrt(Math.max(0, nn * p * (1 - p))) * n())),
    };
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- formatação ---------- */
  const nfc = {};
  const nf = (d = 0) => nfc[d] || (nfc[d] = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const fN = (x, d = 0) => isFinite(x) ? nf(d).format(x) : "—";
  const fP = (x, d = 1) => isFinite(x) ? nf(d).format(x * 100) + "%" : "—";
  const fPP = (x, d = 1) => nf(d).format(Math.abs(x) * 100) + " p.p.";
  const fBRL = (x) => !isFinite(x) ? "—" : Math.abs(x) >= 1e6 ? `R$ ${nf(2).format(x / 1e6)} mi` : Math.abs(x) >= 1e4 ? `R$ ${nf(1).format(x / 1e3)} mil` : `R$ ${nf(0).format(x)}`;
  const fH = (h) => !isFinite(h) ? "—" : h < 1 ? `${nf(0).format(h * 60)} min` : h < 48 ? `${nf(1).format(h)} h` : `${nf(1).format(h / 24)} dias`;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const median = (a) => { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
  const mean = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
  const sum = (a, f = (x) => x) => a.reduce((s, x) => s + f(x), 0);
  const $ = (s, el = document) => el.querySelector(s);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MESL = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const MONTHS = [];
  for (let i = 0; i < 12; i++) { const d = new Date(Date.UTC(2025, 10 + i, 1)); MONTHS.push({ i, y: d.getUTCFullYear(), mo: d.getUTCMonth(), key: `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`, label: `${MES[d.getUTCMonth()]}/${String(d.getUTCFullYear()).slice(2)}`, long: `${MESL[d.getUTCMonth()]} de ${d.getUTCFullYear()}` }); }
  const monthIdx = (t) => { const d = new Date(t); return (d.getUTCFullYear() - 2025) * 12 + d.getUTCMonth() - 10; };
  const fDate = (t) => { const d = new Date(t); return `${String(d.getUTCDate()).padStart(2, "0")}/${String(d.getUTCMonth() + 1).padStart(2, "0")}/${d.getUTCFullYear()}`; };
  const fDT = (t) => { const d = new Date(t); return `${String(d.getUTCDate()).padStart(2, "0")}/${String(d.getUTCMonth() + 1).padStart(2, "0")} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`; };

  /* ---------- ícones ---------- */
  const P = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    home: P('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>'),
    pulse: P('<path d="M3 12h4l2.5-6 4 12L16 12h5"/>'),
    bars: P('<path d="M5 20V10M10 20V4M15 20v-7M20 20v-4"/>'),
    check: P('<path d="M4 12.5 9.5 18 20 6.5"/>'),
    alert: P('<path d="M12 3.5 22 20H2z"/><path d="M12 10v4.5M12 17.5v.3"/>'),
    flag: P('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    list: P('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'),
    users: P('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.6 3.2-5.5 6.5-5.5s6 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.3.2 4 1.7 4.5 4.5"/>'),
    star: P('<path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z"/>'),
    spark: P('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'),
    info: P('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/>'),
    truck: P('<path d="M2.5 6h11v10h-11zM13.5 9.5h4l3.5 3.5v3h-7.5"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>'),
    box: P('<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>'),
    money: P('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.7"/><path d="M6 9.5v.01M18 14.5v.01"/>'),
    gauge: P('<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>'),
    cycle: P('<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/>'),
    book: P('<path d="M4 4.5h6a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H4zM20 4.5h-6a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2h6z"/>'),
    queue: P('<rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="11" height="4" rx="1.5"/>'),
    chat: P('<path d="M4 5h16v11H9l-5 4z"/>'),
    warehouse: P('<path d="M3 20V8.5L12 4l9 4.5V20"/><path d="M7 20v-7h10v7M7 16.5h10"/>'),
    route: P('<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H16a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h7.5"/>'),
  };
  const STATUS_TXT = { ok: "Na meta", warn: "Atenção", bad: "Fora da meta", neutral: "Sem meta" };
  /** status por meta: higherBetter, tolerância relativa para "Atenção" */
  function statusOf(v, target, higherBetter = true, tol = 0.05) {
    if (!isFinite(v) || target == null) return "neutral";
    const ok = higherBetter ? v >= target : v <= target;
    if (ok) return "ok";
    const gap = higherBetter ? (target - v) / Math.abs(target) : (v - target) / Math.abs(target);
    return gap <= tol ? "warn" : "bad";
  }

  /* ---------- estrutura (menu, filtros, rotas) ---------- */
  const state = { from: 0, to: 11, view: null };
  let CFG = null;
  const listeners = [];
  function periodOptions() {
    const o = [["0-11", "Últimos 12 meses"], ["6-11", "Últimos 6 meses"], ["9-11", "Últimos 3 meses"]];
    MONTHS.slice().reverse().forEach(m => o.push([`${m.i}-${m.i}`, m.long.charAt(0).toUpperCase() + m.long.slice(1)]));
    return o;
  }

const permanent = (e) => ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "tools_unavailable"].includes(e?.code);
let aiTier = "quick";
try { aiTier = localStorage.getItem("rotalume-sd-tier") || "quick"; } catch (e) { /* ignora */ }
function setAI(on, why) {
  aiReady = on;
  const chip = $("#ai-chip"); if (chip) { chip.className = "chip" + (on ? " on" : ""); chip.lastChild.textContent = on ? "IA: Claude conectado" : "IA: modo demonstração"; }
  const st = $("#ai-state"); if (st) st.textContent = on ? "Claude conectado" : "Modo demonstração";
  const note = $("#ai-note"); if (note) { note.className = "note" + (on ? " ok" : ""); note.innerHTML = on ? "<b>Claude conectado.</b> As respostas usam a sua conta Claude. A primeira pergunta pede autorização." : `<b>Modo demonstração.</b> ${why || "Fora do Claude, o assistente responde a perguntas comuns com regras calculadas sobre os dados."}`; }
  document.querySelectorAll("#ai-mode button").forEach(b => { b.disabled = !on; b.setAttribute("aria-pressed", String(b.dataset.v === aiTier)); });
  briefUI(); themesBtn();
}
function briefUI() { const b = $("#btn-brief"); if (!b) return; b.hidden = !aiReady; b.innerHTML = I.spark + "Resumo da IA"; }
function themesBtn() { const b = $("#btn-themes"); if (b) b.innerHTML = I.spark + (aiReady ? "Analisar com IA" : "Atualizar temas"); }
let briefCtl = null;
document.addEventListener("click", async (e) => {
  if (e.target.closest("#btn-brief")) {
    if (!aiReady) return; const box = $("#r-brief"); box.hidden = false; briefCtl?.abort(); briefCtl = new AbortController();
    const f = toF({}), payload = { recorte: descF(f), geral: rk(kpi(filt(f))), por_categoria: CATS.map(c => ({ categoria: c[0], ...rk(kpi(filt({ ...f, cat: c[0] }))) })) };
    box.innerHTML = `<p class="thinking">Pensando…</p>`; e.target.closest("#btn-brief").disabled = true;
    try { await sample(`${RULES()}\n\nEscreva um resumo executivo em 4 bullets curtos e uma linha de próximo passo, usando só estes dados (JSON):\n${JSON.stringify(payload)}`, { modelTier: "quick", signal: briefCtl.signal, onText: ({ text }) => { box.innerHTML = md(text); } }); }
    catch (er) { if (er.code !== "cancelled") { box.innerHTML = (er.text ? md(er.text) : "") + `<p class="sub-txt">${esc(errMsg(er))}</p>`; if (permanent(er)) setAI(false, errMsg(er)); } }
    finally { const b = $("#btn-brief"); if (b) b.disabled = false; }
  }
  if (e.target.closest("#btn-themes")) {
    if (!aiReady) { themesLocal(); return; }
    const r = cRows(); if (!r.length) return; const btn = e.target.closest("#btn-themes"); btn.disabled = true;
    $("#s-themes").innerHTML = `<p class="thinking">O Claude está lendo ${fN(Math.min(r.length, 400))} comentários…</p>`;
    try {
      const out = await sample.json(`Você analisa comentários de pesquisa de satisfação de um Service Desk (empresa fictícia). Cada linha é "nota(1-5)|categoria|comentário".\nAgrupe em 4 a 6 temas e conte quantos comentários pertencem a cada um.\nResponda SOMENTE com um array JSON: [{"tema": string curto, "qtd": número, "sentimento": "negativo"|"neutro"|"positivo", "exemplo": um comentário real da lista, "acao": ação de melhoria em até 15 palavras}], do maior para o menor qtd.\n\n${r.slice(-400).map(t => `${t.csat}|${t.cat}|${t.comment}`).join("\n")}`, { modelTier: "default" });
      if (!Array.isArray(out)) throw { code: "invalid_json" };
      themesKey = cKey(); drawThemes(out.slice(0, 6).map(x => ({ tema: String(x.tema || ""), qtd: +x.qtd || 0, sentimento: String(x.sentimento || "neutro"), exemplo: String(x.exemplo || ""), acao: String(x.acao || "") })), true);
    } catch (er) { $("#s-themes").innerHTML = `<p class="sub-txt">${esc(errMsg(er))}</p>`; if (permanent(er)) { setAI(false, errMsg(er)); themesLocal(); } }
    finally { btn.disabled = false; }
  }
  const mb = e.target.closest("#ai-mode button"); if (mb && aiReady) { aiTier = mb.dataset.v; try { localStorage.setItem("rotalume-sd-tier", aiTier); } catch (er) { /* ignora */ } document.querySelectorAll("#ai-mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === aiTier))); }
  const sg = e.target.closest(".sug"); if (sg) ask(sg.textContent);
  if (e.target.closest("#btn-stop")) chatCtl?.abort();
  if (e.target.closest("#btn-clear")) { chatCtl?.abort(); turns = []; welcome(); }
});
const SUGS = ["Por que o CSAT caiu em março?", "Quais assuntos mais estouram o prazo?", "Como está a fila agora?", "O portal reduziu os chamados de senha?", "Qual analista precisa de apoio?", "Faça um resumo executivo"];
let turns = [], chatCtl = null;
function addMsg(role, html, steps) {
  const log = $("#log"), d = document.createElement("div"); d.className = "msg " + (role === "user" ? "u" : "a");
  if (role === "user") d.textContent = html; else d.innerHTML = `<span class="lbl">${aiReady ? "Claude" : "Modo demonstração"}</span>${steps ? '<div class="steps"></div>' : ""}<div class="body">${html}</div>`;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function welcome() { const log = $("#log"); if (!log) return; log.innerHTML = ""; addMsg("assistant", md(`Olá! Sou o analista virtual da Central de Chamados. Posso investigar **prazos, fila, equipe, satisfação e canais** com os dados do painel.\nRecorte atual: ${descF(toF({}))}.\nEscolha uma sugestão abaixo ou escreva a sua pergunta.`)); }
async function ask(q) {
  q = q.trim(); if (!q) return; $("#ask").value = ""; addMsg("user", q);
  const log = $("#log");
  if (!aiReady) { const m = addMsg("assistant", `<p class="thinking">Calculando…</p>`); setTimeout(() => { m.querySelector(".body").innerHTML = md(localAnswer(q)) + `<p class="sub-txt">Resposta do modo demonstração. Abra o painel no Claude para perguntas livres.</p>`; log.scrollTop = log.scrollHeight; }, 250); return; }
  const m = addMsg("assistant", `<p class="thinking">Pensando…</p>`, true), body = m.querySelector(".body"), steps = m.querySelector(".steps");
  onStep = (name) => { const s = document.createElement("span"); s.className = "step"; s.textContent = "consultou: " + name; steps.appendChild(s); log.scrollTop = log.scrollHeight; };
  turns.push({ role: "user", content: q }); if (turns.length > 10) turns = turns.slice(-10); while (turns[0] && turns[0].role !== "user") turns.shift();
  chatCtl = new AbortController(); $("#btn-send").disabled = true; $("#btn-stop").hidden = false;
  try {
    const { text, truncated } = await sample([{ role: "user", content: RULES() }, ...turns], { tools: TOOLS, modelTier: aiTier, signal: chatCtl.signal, onText: ({ text }) => { body.innerHTML = md(text); log.scrollTop = log.scrollHeight; } });
    body.innerHTML = md(text) + (truncated ? `<p class="sub-txt">Resposta interrompida pelo limite de tamanho. Peça algo mais específico.</p>` : "");
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    body.innerHTML = (e.text ? md(e.text) : "") + `<p class="sub-txt">${e.code === "cancelled" ? "Interrompido." : esc(errMsg(e))}</p>`;
    if (permanent(e)) setAI(false, errMsg(e)); turns.pop();
  } finally { $("#btn-send").disabled = false; $("#btn-stop").hidden = true; onStep = () => {}; log.scrollTop = log.scrollHeight; }
}
document.addEventListener("submit", e => { if (e.target.id === "ask-form") { e.preventDefault(); ask($("#ask").value); } });
document.addEventListener("keydown", e => { if (e.target.id === "ask" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("#ask").value); } });
function vAssist() { if (!$("#log").children.length) welcome(); }

$("#tpl-sobre").content.querySelector("#ab-n").textContent = fN(T.length);
K.shell({
  key: "rotalume-sd", title: "Service Desk", company: "Grupo Rotalume · empresa fictícia", asOf: "31/10/2026",
  accent: ["#0d7a72", "#4fc7bd", "#dcf1ef", "#12332f"],
  logo: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2.5-5 2.5"/></svg>`,
  sideFoot: `<span class="chip" id="ai-chip"><span class="dot"></span><span>IA: verificando…</span></span>`,
  footer: "Projeto de portfólio de Breno Silva · Rotalume é uma empresa fictícia e todos os dados são simulados.",
  filters: [
    { id: "group", label: "Equipe", options: [["all", "Todas"], ...GSHORT.map((g, i) => [String(i), GROUPS[i]])] },
    { id: "type", label: "Tipo", options: [["all", "Todos"], ["Incidente", "Incidentes"], ["Requisição", "Requisições"]] },
  ],
  views: [
    { id: "resumo", label: "Visão geral", icon: "home", desc: "Prazos, volume e canais", heading: "Visão geral do atendimento", sub: "Prazo, satisfação e volume de chamados", render: vResumo },
    { id: "fila", label: "Fila e prazos", icon: "queue", desc: "O que está aberto agora", heading: "Fila e prazos", sub: "Chamados abertos, vencidos e horários de pico", render: vFila },
    { id: "equipe", label: "Equipe", icon: "users", desc: "Desempenho por analista", heading: "Desempenho da equipe", sub: "Resolução, reabertura e satisfação por analista", render: vEquipe },
    { id: "satisfacao", label: "Satisfação", icon: "star", desc: "Notas e comentários", heading: "Satisfação do usuário", sub: "O que os usuários acharam do atendimento", render: vSatisf },
    { id: "assistente", label: "Assistente IA", icon: "spark", desc: "Pergunte aos dados", heading: "Assistente de análise", sub: "Faça perguntas em linguagem natural", render: vAssist },
    { id: "sobre", label: "Sobre os dados", icon: "book", desc: "Definições e premissas", heading: "Sobre os dados", sub: "Como o painel foi construído", noFilters: true },
  ],
});
$(".ai-dot").innerHTML = I.spark;
$("#sugs").innerHTML = SUGS.map(s => `<button class="sug" type="button">${s}</button>`).join("");
welcome();
setAI(false, "Verificando se o Claude está disponível…");
(async () => {
  try { sample = window.claude && typeof window.claude.use === "function" ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
  if (sample) { let tools = true; try { const lim = await sample.limits(); tools = !!lim.tools; } catch (e) { /* assume */ } setAI(tools, tools ? "" : "Esta visualização do Claude não permite que a IA consulte os dados."); }
  else setAI(false);
  if (K.state.view === "resumo" || K.state.view === "satisfacao") K.render();
})();
window.__sd = { T, kpi, filt, TOOLS, localAnswer };
})();

</script>
